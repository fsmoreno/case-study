name: CD local (Kind + Floci)

# Deploy REAL em um Kind efêmero dentro do runner, com Floci (VPC, RDS e Secrets Manager emulados), ESO e o mesmo
# chart Helm de produção. Valida: assinatura da imagem, Terraform local, migration, probes, smoke test e rollback.
# Roda depois que o CI passa na main e implanta a imagem EXATA construída, escaneada e assinada pelo CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA completo do commit cujas imagens (sha-<7>) já foram publicadas pelo CI"
        required: true

concurrency:
  group: cd-local
  cancel-in-progress: false # não interrompe um deploy em andamento

permissions:
  contents: read
  packages: read # pull no GHCR

env:
  REGISTRY: ghcr.io
  CLUSTER: estuda
  KUBE_CONTEXT: kind-estuda # o Makefile cria o cluster com este nome (kind-<CLUSTER>)

jobs:
  deploy:
    name: Deploy no Kind e validação
    # Só continua se o CI foi bem-sucedido (ou se foi disparo manual).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolver o commit
        id: ver
        env:
          # Entrada passada por variável de ambiente (e não interpolada no script): evita injeção de comando.
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA inválido: informe o commit completo (40 caracteres)"; exit 1; }
          {
            echo "sha=${EVENT_SHA}"
            echo "short=${EVENT_SHA::7}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.sha }}

      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true # o cluster é criado por `make kind-up`, igual ao ambiente local
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verifica que a imagem foi assinada pelo workflow ci.yml DESTE repositório (sem chave: identidade OIDC).
      - name: Verificar assinatura e baixar imagens
        env:
          SHORT: ${{ steps.ver.outputs.short }}
          OWNER: ${{ steps.ver.outputs.owner }}
        run: |
          for img in estuda-api estuda-api-migrations; do
            ref="${REGISTRY}/${OWNER}/${img}:sha-${SHORT}"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" >/dev/null
            echo "assinatura OK: $ref"
            docker pull "$ref"
            docker tag "$ref" "${img}:ci-${SHORT}"
            docker tag "$ref" "${img}:ci-${SHORT}-rb"   # 2ª "versão" para o ensaio de rollback
          done

      - name: Floci, Kind e ESO
        run: make kind-up

      - name: Terraform local (VPC, RDS e segredo no Floci, com os mesmos módulos de produção)
        run: make tf-apply-local

      # Sem `make monitoring-up` no runner (o stack pesa e não é o objeto do CD): MONITORING=false desliga as CRDs no chart.
      - name: Deploy
        run: make deploy SKIP_BUILD=1 MONITORING=false TAG=ci-${{ steps.ver.outputs.short }}

      - name: Smoke test
        run: make smoke

      # Prova no pipeline que o rollback funciona: nova revisão, volta, e a API continua saudável.
      - name: Ensaio de rollback
        run: |
          make deploy SKIP_BUILD=1 MONITORING=false TAG=ci-${{ steps.ver.outputs.short }}-rb
          helm --kube-context "$KUBE_CONTEXT" -n estuda history app
          make rollback
          make smoke

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          mkdir -p diag
          kubectl --context "$KUBE_CONTEXT" get pods -A -o wide > diag/pods.txt || true
          kubectl --context "$KUBE_CONTEXT" -n estuda describe pods > diag/describe-pods.txt || true
          kubectl --context "$KUBE_CONTEXT" -n estuda get events --sort-by=.lastTimestamp > diag/events.txt || true
          kubectl --context "$KUBE_CONTEXT" -n estuda logs deploy/estuda-api --all-containers --tail=200 > diag/api.log || true
          kubectl --context "$KUBE_CONTEXT" -n estuda logs -l app.kubernetes.io/component=migration --tail=200 > diag/migration.log || true
          kubectl --context "$KUBE_CONTEXT" -n estuda describe externalsecret > diag/externalsecret.txt || true
          helm --kube-context "$KUBE_CONTEXT" -n estuda history app > diag/helm-history.txt || true
          docker logs floci --tail 200 > diag/floci.log 2>&1 || true

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: diagnostico-cd-local
          path: diag/

      - name: Destruir o ambiente
        if: always()
        run: make kind-down || true
