# O banco NÃO roda no cluster: é o RDS (emulado pelo Floci no Kind; real em produção). Este chart só entrega o segredo.
externalSecret:
  region: us-east-1
  # irsa (padrão, produção): identidade do controller do ESO, sem credenciais no cluster.
  # static (Kind + Floci): credenciais FICTÍCIAS em um Secret criado por `make floci-creds`. Ver values-floci.yaml.
  auth: irsa
  staticCredentialsSecret: floci-aws-credentials
  remoteKey: estuda/db       # nome do segredo no Secrets Manager (criado pelo Terraform)
  targetSecret: estuda-db    # Secret Kubernetes criado pelo ESO e consumido pelo release app
