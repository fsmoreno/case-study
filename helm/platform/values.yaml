# Padrão = PLANO B: MySQL em StatefulSet + Secret criado por `make secret-local`.
# Desenho principal (values-floci.yaml): banco é o RDS do Floci, mysql.enabled=false e o ESO cria o Secret.
mysql:
  enabled: true
  image: mysql:8.4
  # Secret com as chaves DB_NAME, DB_USER, DB_PASSWORD, MYSQL_ROOT_PASSWORD (plano B).
  existingSecret: estuda-db
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }   # 512Mi é apertado para o MySQL 8.4 durante a inicialização

externalSecret:
  enabled: false
  region: us-east-1
  auth: static                         # static (Floci, local) | irsa (produção: identidade do controller do ESO)
  staticCredentialsSecret: floci-aws-credentials
  remoteKey: estuda/db                 # nome do segredo no Secrets Manager
  targetSecret: estuda-db              # Secret Kubernetes criado pelo ESO
