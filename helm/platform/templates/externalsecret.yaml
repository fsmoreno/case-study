{{- if .Values.externalSecret.enabled }}
# SecretStore + ExternalSecret: o ESO lê o segredo do Secrets Manager e cria o Secret Kubernetes consumido pelo
# release "app". Fica neste chart (e não no app) porque o hook de migration do app roda ANTES dos demais recursos
# do release e já precisa do Secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
      {{- if eq .Values.externalSecret.auth "static" }}
      # Local (Floci): credenciais FICTÍCIAS em um Secret criado pelo Makefile. Nunca em produção.
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.externalSecret.staticCredentialsSecret }}
            key: access-key
          secretAccessKeySecretRef:
            name: {{ .Values.externalSecret.staticCredentialsSecret }}
            key: secret-access-key
      {{- end }}
      # auth=irsa (produção): sem bloco "auth". O ESO usa a identidade do próprio controller (ServiceAccount
      # external-secrets anotada com a role do módulo iam-irsa); não há credencial alguma no cluster.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetSecret }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.externalSecret.targetSecret }}
    creationPolicy: Owner
  # Só as chaves que a aplicação usa: a senha root nunca entra no cluster.
  data:
    {{- range $k := list "DB_NAME" "DB_USER" "DB_PASSWORD" }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ $k }}
    {{- end }}
{{- end }}
